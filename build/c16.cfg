# Linker configuration for Commodore C16/Plus4
# Target: C16 - loads at $1000 with screen data, code, and character set
#
# Memory Map:
#   $1000-$195F: Screen data (compressed mazes)
#   $1960-$37FF: Main program code
#   $3800-$3FFF: Character set data (2K)
#
# No BASIC stub - requires SYS 6496 after loading

MEMORY {
    ZP:       file = "",              start = $0002, size = $00FE;
    LOADADDR: file = %O,              start = $0FFE, size = $0002;
    MAIN:     file = %O, define = yes, start = $1000, size = $306C;
}

SEGMENTS {
    ZEROPAGE: load = MAIN,     type = zp,  optional = yes;
    LOADADDR: load = LOADADDR, type = ro;
    SCREENS:  load = MAIN,     type = ro;
    CODE:     load = MAIN,     type = rw;
    RODATA:   load = MAIN,     type = ro,  optional = yes;
    DATA:     load = MAIN,     type = rw,  optional = yes;
    CHARS:    load = MAIN,     type = ro,  start = $3800;
}
